# Радиус действия способности (в блоках)
radius: 30
# Длительность способности (в секундах)
duration: 10
# Перезарядка (в секундах)
cooldown: 30
# Уровень замедления для остальных (0 = Slowness I, 4 = Slowness V, 6 = полная заморозка игроков)
slow-level: 4
# Уровень ускорения для владельца (0 = Speed I)
speed-level: 3
# Во сколько раз замедлять летящие снаряды (стрелы и т.д.), 0.3 = 30% скорости
projectile-factor: 0.3
