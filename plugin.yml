name: Sandevistan
version: 1.0
main: me.sandevistan.SandevistanPlugin
api-version: "1.21"
description: Sandevistan ability (activate with F)
commands:
  sandevistan:
    description: Give or take the Sandevistan ability
    usage: /sandevistan <give|take|check> <player>
    permission: sandevistan.admin
permissions:
  sandevistan.admin:
    description: Allows managing the Sandevistan ability
    default: op
